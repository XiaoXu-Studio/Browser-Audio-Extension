name: Release Browser Extension

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      id-token: write
      contents: write
      attestations: write
    steps:
      # Bootstrap must be inline: local actions cannot be loaded before checkout.
      # No JS checkout bundle, cached workspace, persisted credential, or PR code.
      - name: Checkout exact release commit
        shell: bash
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF_TYPE" == tag ]]
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$GITHUB_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          [[ "$GITHUB_SERVER_URL" == https://github.com ]]
          [[ ! -e .git && -z "$(ls -A .)" ]]
          git init --initial-branch=bootstrap .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$CHECKOUT_TOKEN" | base64 -w0)"
          GIT_TERMINAL_PROMPT=0 git -c core.hooksPath=/dev/null fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0 CHECKOUT_TOKEN
          git -c core.hooksPath=/dev/null checkout --detach "$GITHUB_SHA"
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
      - name: Install verified Node.js
        run: sh release-tools/setup-node.sh
      - name: Build maintained release tools
        run: |
          (cd release-tools/attest && npm ci --ignore-scripts --no-audit --no-fund)
          (cd release-tools/release && npm ci --ignore-scripts --no-audit --no-fund)
          npm audit --prefix release-tools/attest --audit-level=low
          npm audit --prefix release-tools/release --audit-level=low
          node --test release-tools/security.test.cjs
          (cd release-tools/attest && npm run lint && node node_modules/typescript/bin/tsc --noEmit && node --experimental-vm-modules node_modules/jest/bin/jest.js --runInBand)
          (cd release-tools/release && npm run typecheck && npm test -- --run)
          npm run package --prefix release-tools/attest
          npm run build --prefix release-tools/release
          node release-tools/verify.cjs
      - name: Install Dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Package Extension
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd dist
          zip -r "../Browser-Audio-Extension-${RELEASE_TAG}.zip" .
      - name: Verify ZIP
        run: npm run verify:zip
      - name: Attest Build Provenance
        uses: ./release-tools/attest
        with:
          subject-path: 'Browser-Audio-Extension-*.zip'
      - name: Create Release
        uses: ./release-tools/release
        with:
          files: 'Browser-Audio-Extension-*.zip'
          fail_on_unmatched_files: true
          generate_release_notes: true
